name: GitFlow Policy

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  validate-gitflow:
    name: 檢查 GitFlow 合併方向
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      BASE_REF: ${{ github.base_ref }}
      HEAD_REF: ${{ github.head_ref }}

    steps:
      - name: 檢查來源與目標分支
        shell: bash
        run: |
          echo "來源分支：${HEAD_REF}"
          echo "目標分支：${BASE_REF}"

          case "${BASE_REF}" in
            main)
              case "${HEAD_REF}" in
                release/*|hotfix/*)
                  echo "允許：${HEAD_REF} → main"
                  ;;
                *)
                  echo "::error::main 只接受 release/* 或 hotfix/* Pull Request。"
                  exit 1
                  ;;
              esac
              ;;

            develop)
              case "${HEAD_REF}" in
                feature/*|bugfix/*|release/*|hotfix/*|main)
                  echo "允許：${HEAD_REF} → develop"
                  ;;
                *)
                  echo "::error::develop 只接受 feature/*、bugfix/*、release/*、hotfix/* 或 main 的 Pull Request。"
                  exit 1
                  ;;
              esac
              ;;
          esac